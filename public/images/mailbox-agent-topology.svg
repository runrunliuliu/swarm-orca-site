<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="多 Agent 系统的消息总线拓扑示意图">
  <text x="30" y="38" font-family="Georgia,serif" font-size="16" fill="#2F5D50" font-weight="700">多 Agent 常见拓扑：多出来一根总线</text>
  <text x="30" y="62" font-size="13" fill="#737A74">投递方不直连 agent，统一先进总线，再由总线路由到各自的 inbox</text>

  <rect x="40" y="92" width="190" height="48" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="135" y="114" font-size="13" fill="#1E2321" text-anchor="middle">用户 / 外部触发</text>
  <text x="135" y="132" font-size="12" fill="#737A74" text-anchor="middle">发起任务</text>

  <rect x="355" y="92" width="190" height="48" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="450" y="114" font-size="13" fill="#1E2321" text-anchor="middle">Agent A</text>
  <text x="450" y="132" font-size="12" fill="#737A74" text-anchor="middle">也会给别人派活</text>

  <rect x="670" y="92" width="190" height="48" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="765" y="114" font-size="13" fill="#1E2321" text-anchor="middle">定时任务</text>
  <text x="765" y="132" font-size="12" fill="#737A74" text-anchor="middle">cron / 延时触发</text>

  <path d="M135 140 L135 176" stroke="#B0552F" stroke-width="1.6" marker-end="url(#ar2)"/>
  <path d="M450 140 L450 176" stroke="#B0552F" stroke-width="1.6" marker-end="url(#ar2)"/>
  <path d="M765 140 L765 176" stroke="#B0552F" stroke-width="1.6" marker-end="url(#ar2)"/>
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#B0552F"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#2F5D50"/></marker>
  </defs>

  <rect x="40" y="176" width="820" height="58" fill="#E7EDE9" stroke="#2F5D50" stroke-width="1.5"/>
  <text x="450" y="200" font-size="14" fill="#2F5D50" text-anchor="middle" font-weight="600">消息总线 / broker</text>
  <text x="450" y="220" font-size="12" fill="#4A524D" text-anchor="middle">按收件人或 topic 路由 · 大规模时常落盘 · 常带重试与死信</text>

  <path d="M180 234 L180 300" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar3)"/>
  <path d="M450 234 L450 300" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar3)"/>
  <path d="M720 234 L720 300" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar3)"/>

  <rect x="80" y="300" width="200" height="80" fill="#FFFFFF" stroke="#2F5D50" stroke-width="1.4"/>
  <rect x="94" y="312" width="172" height="22" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="180" y="327" font-size="12" fill="#1E2321" text-anchor="middle">inbox</text>
  <text x="180" y="352" font-size="12" fill="#4A524D" text-anchor="middle">自己的记忆 / 上下文</text>
  <text x="180" y="370" font-size="12" fill="#737A74" text-anchor="middle">Agent 1</text>

  <rect x="350" y="300" width="200" height="80" fill="#FFFFFF" stroke="#2F5D50" stroke-width="1.4"/>
  <rect x="364" y="312" width="172" height="22" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="450" y="327" font-size="12" fill="#1E2321" text-anchor="middle">inbox</text>
  <text x="450" y="352" font-size="12" fill="#4A524D" text-anchor="middle">自己的记忆 / 上下文</text>
  <text x="450" y="370" font-size="12" fill="#737A74" text-anchor="middle">Agent 2</text>

  <rect x="620" y="300" width="200" height="80" fill="#FFFFFF" stroke="#2F5D50" stroke-width="1.4"/>
  <rect x="634" y="312" width="172" height="22" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="720" y="327" font-size="12" fill="#1E2321" text-anchor="middle">inbox</text>
  <text x="720" y="352" font-size="12" fill="#4A524D" text-anchor="middle">自己的记忆 / 上下文</text>
  <text x="720" y="370" font-size="12" fill="#737A74" text-anchor="middle">Agent 3</text>

  <text x="30" y="404" font-size="12" fill="#737A74">注意：Actor 的信箱长在 actor 身上，别人碰不到；这里的 inbox 才能真正挂在某个 agent 名下，中间那段是共享的。</text>
</svg>
