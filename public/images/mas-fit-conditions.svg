<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">适合使用 Agent Swarm 的三个条件</title>
  <desc id="desc">任务可并行、验证可靠和单个轨迹预算充足三个圆的交集表示适合 Swarm</desc>
  <rect width="1000" height="520" fill="#f7f4ed"/>
  <text x="54" y="60" fill="#20302b" font-family="Georgia, 'Songti SC', serif" font-size="28" font-weight="700">什么时候值得启用 Swarm？</text>
  <circle cx="380" cy="250" r="155" fill="#b9d0c5" fill-opacity="0.72" stroke="#4f7569" stroke-width="2"/>
  <circle cx="620" cy="250" r="155" fill="#e3bea9" fill-opacity="0.68" stroke="#c66a3d" stroke-width="2"/>
  <circle cx="500" cy="355" r="155" fill="#d8d3ad" fill-opacity="0.68" stroke="#8f8450" stroke-width="2"/>
  <g font-family="-apple-system, 'PingFang SC', sans-serif" fill="#20302b" text-anchor="middle">
    <text x="330" y="205" font-size="21" font-weight="700">任务可并行</text>
    <text x="330" y="235" font-size="14">方向多 · 顺序依赖弱</text>
    <text x="670" y="205" font-size="21" font-weight="700">验证可靠</text>
    <text x="670" y="235" font-size="14">测试 · Oracle · Judge</text>
    <text x="500" y="423" font-size="21" font-weight="700">轨迹预算充足</text>
    <text x="500" y="452" font-size="14">时间 · Token · 工具额度</text>
    <text x="500" y="308" font-size="25" font-weight="700" fill="#7d3e22">Swarm</text>
    <text x="500" y="337" font-size="14" fill="#7d3e22">可能产生净收益</text>
  </g>
  <text x="54" y="496" fill="#6e7772" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">条件不足时，单 Agent 加少量阅读或审查 Subagent 往往更简单，也更容易验收。</text>
</svg>
