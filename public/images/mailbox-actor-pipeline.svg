<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="Actor 从收信到处理完的流程示意图">
  <text x="30" y="40" font-family="Georgia,serif" font-size="16" fill="#2F5D50" font-weight="700">一个 Actor 的内部管线</text>

  <rect x="40" y="102" width="118" height="46" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="99" y="130" font-size="14" fill="#1E2321" text-anchor="middle">发信方 A</text>
  <rect x="40" y="172" width="118" height="46" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="99" y="200" font-size="14" fill="#1E2321" text-anchor="middle">发信方 B</text>

  <path d="M158 125 L200 125" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar1)"/>
  <path d="M158 195 L182 195 L182 145 L200 145" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar1)"/>
  <defs>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#2F5D50"/></marker>
  </defs>

  <rect x="200" y="96" width="196" height="150" fill="#FFFFFF" stroke="#2F5D50" stroke-width="1.4"/>
  <text x="298" y="82" font-size="15" fill="#2F5D50" text-anchor="middle" font-weight="600">信箱 Mailbox</text>
  <rect x="216" y="108" width="164" height="22" fill="#E7EDE9" stroke="#B7C6BF"/>
  <text x="298" y="123" font-size="12" fill="#2F5D50" text-anchor="middle">消息 1（最早）</text>
  <rect x="216" y="136" width="164" height="22" fill="#E7EDE9" stroke="#B7C6BF"/>
  <text x="298" y="151" font-size="12" fill="#4A524D" text-anchor="middle">消息 2</text>
  <rect x="216" y="164" width="164" height="22" fill="#E7EDE9" stroke="#B7C6BF"/>
  <text x="298" y="179" font-size="12" fill="#4A524D" text-anchor="middle">消息 3</text>
  <rect x="216" y="192" width="164" height="22" fill="#E7EDE9" stroke="#B7C6BF"/>
  <text x="298" y="207" font-size="12" fill="#4A524D" text-anchor="middle">消息 4（最新）</text>
  <text x="298" y="235" font-size="12" fill="#737A74" text-anchor="middle">私有的，别人不能直接插手</text>

  <path d="M396 145 L436 145" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar1)"/>

  <rect x="436" y="100" width="86" height="112" fill="#F0EFE9" stroke="#B0552F" stroke-width="1.4"/>
  <text x="479" y="88" font-size="14" fill="#B0552F" text-anchor="middle" font-weight="600">调度器</text>
  <text x="479" y="150" font-size="12" fill="#1E2321" text-anchor="middle">按顺序</text>
  <text x="479" y="168" font-size="12" fill="#1E2321" text-anchor="middle">一封一封</text>
  <text x="479" y="186" font-size="12" fill="#1E2321" text-anchor="middle">取出来</text>

  <path d="M522 156 L560 156" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar1)"/>

  <rect x="560" y="88" width="230" height="148" fill="#FFFFFF" stroke="#2F5D50" stroke-width="1.4"/>
  <text x="675" y="74" font-size="15" fill="#2F5D50" text-anchor="middle" font-weight="600">Actor</text>
  <rect x="582" y="104" width="186" height="52" fill="#F0EFE9" stroke="#C9CBC2"/>
  <text x="675" y="126" font-size="13" fill="#1E2321" text-anchor="middle">私有状态</text>
  <text x="675" y="145" font-size="12" fill="#737A74" text-anchor="middle">不用加锁，没人能直接改</text>
  <text x="675" y="190" font-size="13" fill="#1E2321" text-anchor="middle">一次只处理一条消息</text>
  <text x="675" y="212" font-size="12" fill="#737A74" text-anchor="middle">处理完才取下一封</text>

  <path d="M790 160 L840 160" stroke="#2F5D50" stroke-width="1.6" marker-end="url(#ar1)"/>
  <text x="846" y="164" font-size="12" fill="#2F5D50">回信</text>

  <text x="30" y="290" font-size="13" fill="#4A524D">关键点：信箱负责“存”，调度器负责“取”，Actor 负责“做”。三件事分开，才做得到“投了就走、一次一条”。</text>
  <text x="30" y="314" font-size="13" fill="#737A74">平时大家把这三样统称“信箱机制”，真拆开看，是三个零件。</text>
</svg>
